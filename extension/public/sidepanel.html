<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Insight</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Page Insight</h1>
      <p id="page-title" class="muted">No page loaded</p>
    </header>
    <div id="access" class="access hidden">
        <p id="access-text" class="muted"></p>
        <button id="access-btn"></button>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-mode="summarize" role="tab">Summarize</button>
      <button class="tab" data-mode="ask" role="tab">Ask</button>
      <button class="tab" data-mode="extract" role="tab">Extract</button>
    </nav>

    <main>
      <section id="mode-summarize" class="mode">
        <button id="run-summarize" class="primary">Summarize this page</button>
      </section>

      <section id="mode-ask" class="mode hidden">
        <form id="ask-form">
          <textarea id="question" rows="3" placeholder="Ask a question about this page"></textarea>
          <button class="primary" type="submit">Ask</button>
        </form>
      </section>

      <section id="mode-extract" class="mode hidden">
        <label for="schema">What to extract</label>
        <select id="schema">
          <option value="auto">Auto-detect</option>
          <option value="product">Product</option>
          <option value="event">Event</option>
          <option value="contact">Contact</option>
        </select>
        <button id="run-extract" class="primary">Extract data</button>
      </section>

      <div id="status" class="muted" aria-live="polite"></div>
      <button id="stop" class="hidden">Stop</button>
      <div id="output" class="output"></div>
      <div id="output-actions" class="hidden">
        <button id="copy">Copy</button>
      </div>
    </main>

    <script src="sidepanel.js"></script>
  </body>
</html>
